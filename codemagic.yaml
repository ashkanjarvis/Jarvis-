workflows:
  android-native-build:
    name: Jarvis Android APK Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Check files
        script: |
          ls -la
      - name: Build debug APK
        script: |
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
